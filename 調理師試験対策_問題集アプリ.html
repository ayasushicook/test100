<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>調理免許講師 あや 一問一答100問</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #2a2b3a;
    --bg-deep: #1c1d29;
    --surface: #f6f2ea;
    --surface-dim: #ece5d6;
    --ink: #2c2823;
    --ink-soft: #756d5f;
    --line: #ded4bd;
    --gold: #a5875a;
    --gold-soft: #c9b083;
    --red: #8a4f4d;
    --green: #5c7360;
    --accent-deep: #565b61;
    --shadow: 0 18px 40px -18px rgba(0,0,0,0.4);
    --radius: 18px;
    font-size: 17px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #22334f 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--surface);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overscroll-behavior: none;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: max(20px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    position:relative;
  }
  .brush-rule{
    height:3px;
    width:56px;
    background: linear-gradient(90deg, var(--gold), transparent);
    border-radius:2px;
    margin: 6px 0 18px;
  }
  h1,h2,h3{ font-family:'Shippori Mincho', serif; margin:0; letter-spacing:.02em;}
  .eyebrow{
    font-size:12.5px;
    letter-spacing:.22em;
    color: var(--gold-soft);
    font-weight:700;
  }
  .title-row{ display:flex; align-items:center; gap:12px; }
  .title-icon{
    flex:none;
    width:56px; height:56px;
    border-radius:50%;
    background: var(--surface);
    border: 2px solid var(--gold-soft);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .title-icon img{ width:100%; height:100%; object-fit:cover; object-position: top center; }
  .screen{ display:none; flex-direction:column; flex:1; animation: fadeUp .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  /* ---------- HOME ---------- */
  #screen-home h1{ font-size: 26px; color:#fbeed4; line-height:1.4; }
  .stat-strip{
    display:flex;
    gap:10px;
    margin: 18px 0 24px;
  }
  .stat-card{
    flex:1;
    background: rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:14px;
    padding:12px 10px;
    text-align:center;
  }
  .stat-card .num{ font-family:'Shippori Mincho', serif; font-size:22px; color:var(--gold-soft); display:block;}
  .stat-card .lbl{ font-size:11px; color:#c9d2e0; letter-spacing:.05em; }

  .menu-board{
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 6px;
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .menu-board-head{
    padding: 16px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .menu-board-head .jp{ font-family:'Shippori Mincho', serif; font-size:15px; color:var(--ink-soft); }
  .menu-list{ list-style:none; margin:0; padding:6px; overflow-y:auto; }
  .menu-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    background:none;
    border:none;
    border-bottom: 1px dashed var(--line);
    padding: 14px 10px;
    text-align:left;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    cursor:pointer;
  }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item .name{ font-size:15.5px; font-weight:700; }
  .menu-item .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .menu-item .count{
    font-family:'Shippori Mincho', serif;
    font-size:13px;
    color: var(--ink-soft);
    white-space:nowrap;
  }
  .menu-item.special .name{ color: var(--red); }
  .menu-item.special .count{ color: var(--red); }
  .menu-item .badge{
    display:inline-block;
    margin-left:6px;
    background: var(--red);
    color:#fff;
    font-size:10.5px;
    padding: 1px 7px;
    border-radius: 20px;
    font-weight:700;
  }
  .footnote{
    text-align:center;
    font-size:11px;
    color:#9aa6ba;
    margin-top:14px;
    line-height:1.6;
  }

  /* ---------- QUIZ ---------- */
  .quiz-top{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:#fbeed4;
    width:36px; height:36px;
    border-radius:50%;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .progress-wrap{ flex:1; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:#c9d2e0; margin-bottom:6px;}
  .progress-track{ height:6px; background:rgba(255,255,255,0.12); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); border-radius:6px; transition: width .3s ease; }

  .qcard{
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px 20px;
    position:relative;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .qcard .cat-tag{
    display:inline-block;
    font-size:11.5px;
    color: var(--gold);
    border:1px solid var(--gold);
    border-radius:20px;
    padding:3px 10px;
    font-weight:700;
    align-self:flex-start;
    margin-bottom:14px;
  }
  .qcard .qtext{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    line-height:1.65;
    font-weight:700;
    margin-bottom:20px;
  }
  .choices{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }
  .choice-btn{
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 14.5px;
    line-height:1.5;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .choice-btn:active{ transform: scale(0.985); }
  .choice-btn .num{
    flex:none;
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    color:var(--ink-soft);
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
  }
  .choice-btn.correct{ border-color: var(--green); background: #eef5ee; }
  .choice-btn.correct .num{ border-color: var(--green); background: var(--green); color:#fff; }
  .choice-btn.wrong{ border-color: var(--red); background: #fbeeec; }
  .choice-btn.wrong .num{ border-color: var(--red); background: var(--red); color:#fff; }
  .choice-btn[disabled]{ cursor:default; }
  .choice-btn.dim{ opacity:.55; }

  .stamp{
    position:absolute;
    top: 14px; right: 16px;
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size: 15px;
    border: 3px solid currentColor;
    border-radius: 50%;
    width: 54px; height:54px;
    display:flex; align-items:center; justify-content:center;
    transform: rotate(8deg) scale(0.5);
    opacity:0;
    transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    pointer-events:none;
  }
  .stamp.show{ opacity:0.92; transform: rotate(8deg) scale(1); }
  .stamp.ok{ color: var(--green); }
  .stamp.ng{ color: var(--red); }

  .explain-box{
    margin-top:16px;
    background: var(--surface-dim);
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    padding: 13px 14px;
    display:none;
  }
  .explain-box.show{ display:block; animation: fadeUp .3s ease; }
  .explain-box .explain-label{
    font-size:11px;
    font-weight:700;
    color: var(--gold);
    letter-spacing:.08em;
    margin-bottom:5px;
  }
  .explain-box .explain-text{
    font-size:13.5px;
    line-height:1.65;
    color: var(--ink);
  }
  .explain-box .wrong-label{
    font-size:11px;
    font-weight:700;
    color: var(--red);
    letter-spacing:.08em;
    margin-top:12px;
    margin-bottom:5px;
  }
  .explain-box .wrong-text{
    font-size:12.5px;
    line-height:1.7;
    color: var(--ink-soft);
  }

  .memo-box{
    margin-top:14px;
    display:none;
  }
  .memo-box.show{ display:block; animation: fadeUp .3s ease; }
  .memo-box .memo-label{
    font-size:11px;
    font-weight:700;
    color: var(--ink-soft);
    letter-spacing:.08em;
    margin-bottom:5px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .memo-box textarea{
    width:100%;
    min-height:64px;
    resize:vertical;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    line-height:1.6;
    color: var(--ink);
    background: #fff;
    box-sizing:border-box;
  }
  .memo-box textarea:focus{
    outline:none;
    border-color: var(--gold);
  }
  .memo-box .memo-saved{
    font-size:10.5px;
    color: var(--green);
    margin-top:4px;
    opacity:0;
    transition: opacity .3s ease;
  }
  .memo-box .memo-saved.show{ opacity:1; }

  .next-bar{ margin-top:16px; }

  .interrupt-btn{
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:#fbeed4;
    height:36px;
    padding: 0 14px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex; align-items:center; gap:6px;
    cursor:pointer;
    flex:none;
  }

  /* ---------- STATS ---------- */
  .stats-head{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .stats-head h2{ font-size:21px; color:#fbeed4; flex:1; }
  .stats-summary{
    display:flex; gap:10px; margin-bottom:18px;
  }
  .stats-panel{
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 8px;
    flex:1;
    overflow-y:auto;
  }
  .stats-panel h3{ font-size:14px; color: var(--ink-soft); margin-bottom:14px; font-weight:600; letter-spacing:.02em; }
  .stats-row{ margin-bottom:16px; }
  .stats-row-head{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .stats-row-head .cat-name{ font-weight:700; }
  .stats-row-head .cat-nums{ color: var(--ink-soft); }
  .stats-bar-track{ height:9px; background: var(--surface-dim); border-radius:6px; overflow:hidden; }
  .stats-bar-fill{ height:100%; border-radius:6px; transition: width .4s ease; }
  .stats-empty{ text-align:center; color: var(--ink-soft); font-size:13.5px; padding: 30px 10px; }
  .btn-primary{
    width:100%;
    background: var(--red);
    color:#fff;
    border:none;
    border-radius: 12px;
    padding: 14px;
    font-size:15px;
    font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
    cursor:pointer;
    box-shadow: 0 10px 20px -8px rgba(178,59,46,0.6);
  }
  .btn-secondary{
    width:100%;
    background: transparent;
    color: #fbeed4;
    border:1.5px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    padding: 13px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
    cursor:pointer;
    margin-top:10px;
  }

  /* ---------- RESULT ---------- */
  #screen-result{ justify-content:center; align-items:center; text-align:center; }
  .result-card{
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 24px;
    width:100%;
  }
  .result-card .eyebrow{ color: var(--gold); }
  .result-score{
    font-family:'Shippori Mincho', serif;
    font-size:52px;
    font-weight:800;
    margin: 10px 0 4px;
    color: var(--ink);
  }
  .result-score span{ font-size:22px; color: var(--ink-soft); }
  .result-sub{ font-size:13.5px; color:var(--ink-soft); margin-bottom:22px; }
  .result-actions{ display:flex; flex-direction:column; gap:10px; }
  .result-actions .btn-primary, .result-actions .btn-ghost{ width:100%; }
  .btn-ghost{
    background:none; border:1.5px solid var(--line); color: var(--ink);
    border-radius:12px; padding:13px; font-weight:700; font-family:'Zen Kaku Gothic New', sans-serif; cursor:pointer;
  }

  /* ---------- WEAK LIST ---------- */
  .weak-list{ display:flex; flex-direction:column; gap:10px; margin-bottom: 10px; }
  .weak-item{
    background: var(--surface-dim);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 13px;
  }
  .weak-item-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .weak-cat{
    font-size:10.5px;
    color: var(--gold);
    border:1px solid var(--gold);
    border-radius:20px;
    padding:2px 8px;
    font-weight:700;
  }
  .weak-tries{ font-size:11px; color: var(--ink-soft); }
  .weak-q{ font-size:13.5px; line-height:1.55; font-weight:700; margin-bottom:5px; }
  .weak-a{ font-size:12.5px; color: var(--green); }
  .note-edit{
    width:100%;
    margin-top:8px;
    min-height:56px;
    resize:vertical;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 11px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    line-height:1.6;
    color: var(--ink);
    background: var(--surface-dim);
    box-sizing:border-box;
  }
  .note-edit:focus{ outline:none; border-color: var(--gold); background:#fff; }

  /* ---------- RESET ---------- */
  .reset-row{ text-align:center; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .reset-link{
    background:none;
    border:none;
    color: var(--red);
    font-size:12.5px;
    text-decoration: underline;
    font-family:'Zen Kaku Gothic New', sans-serif;
    cursor:pointer;
    padding: 6px;
  }

  /* ---------- COUNT MODAL ---------- */
  .count-modal{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(10,10,12,0.55);
    z-index:50;
    align-items:flex-end;
    justify-content:center;
  }
  .count-modal.show{ display:flex; }
  .count-modal-card{
    width:100%;
    max-width:480px;
    background: var(--surface);
    color: var(--ink);
    border-radius: 22px 22px 0 0;
    padding: 22px 20px max(22px, env(safe-area-inset-bottom));
    animation: slideUp .25s ease;
  }
  @keyframes slideUp{ from{ transform: translateY(24px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
  .count-modal-card h3{ font-size:16px; margin-bottom:4px; }
  .count-modal-card .desc{ font-size:12.5px; color: var(--ink-soft); margin-bottom:16px; }
  .count-options{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .count-opt{
    flex:1;
    min-width:70px;
    background: var(--surface-dim);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 8px;
    text-align:center;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    color: var(--ink);
    cursor:pointer;
  }
  .count-opt .n{ display:block; font-family:'Shippori Mincho', serif; font-size:19px; color: var(--gold); }
  .count-cancel{
    width:100%;
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size:13px;
    padding: 8px;
    cursor:pointer;
  }

  ::selection{ background: var(--gold-soft); }
</style>
</head>

const QUIZ_DATA = [{"id": "q1", "category": "公衆衛生学", "question": "公衆衛生活動について述べた文のうち、最も適切なものはどれか。", "choices": ["感染症予防の効果は第二次世界大戦の前後を通じてほとんど見られなかった", "主に文部科学省が中心となって進める活動である", "国・地方自治体に加え、民間団体も加わった組織的な取り組みとして進められる", "2000年以降、がんや心疾患による死亡率は上昇を続けている"], "correctIndex": 2, "explanation": "公衆衛生活動は国や地方自治体だけでなく、民間団体も含めた組織的な取り組みとして推進される。", "wrongExplanation": "①感染症予防は戦後大きく効果を上げており、事実と逆の内容。②文部科学省ではなく厚生労働省などが中心。④2000年以降、がんや心疾患の死亡率は横ばい〜改善傾向にあり、上昇し続けているわけではない。"}, {"id": "q2", "category": "公衆衛生学", "question": "世界保健機関(WHO)憲章が示す「健康」の定義に含まれる要素の組み合わせとして正しいものはどれか。", "choices": ["肉体的・精神的・経済的に満たされている状態", "肉体的・精神的・社会的に満たされている状態", "個人的・国際的に満たされている状態", "肉体的・経済的な面でのみ満たされている状態"], "correctIndex": 1, "explanation": "WHO憲章の健康の定義は「肉体的・精神的・社会的に完全に良好な状態」とされている。", "wrongExplanation": "①③④WHO憲章の定義は「肉体的・精神的・社会的」の3要素であり、経済的・個人的・国際的という語は含まれない。"}, {"id": "q3", "category": "公衆衛生学", "question": "国民生活基礎調査で「大規模調査」が実施される周期はどれか。", "choices": ["毎年", "2年に一度", "3年に一度", "5年に一度"], "correctIndex": 2, "explanation": "国民生活基礎調査は毎年簡易調査が行われ、3年ごとに大規模調査が実施される。", "wrongExplanation": "①毎年行われるのは簡易調査。②5年ではなく③3年が正しい周期。④も誤り。"}, {"id": "q4", "category": "公衆衛生学", "question": "地球の大気を構成する気体のうち、体積比で最も多くを占めるのはどれか。", "choices": ["酸素", "二酸化炭素", "窒素", "アルゴン"], "correctIndex": 2, "explanation": "大気の主成分は窒素(約78%)で、次いで酸素(約21%)。", "wrongExplanation": "①酸素は約21%で2番目。②二酸化炭素はごく微量(0.04%程度)。④アルゴンは1%未満で3番目。"}, {"id": "q5", "category": "公衆衛生学", "question": "四大公害病の一つ「イタイイタイ病」の原因となった物質はどれか。", "choices": ["ダイオキシン類", "カドミウム", "有機水銀", "二酸化硫黄"], "correctIndex": 1, "explanation": "イタイイタイ病は神通川流域のカドミウム汚染が原因とされる、四大公害病の一つ。", "wrongExplanation": "①ダイオキシン類は環境ホルモンとして知られるが公害病の原因ではない。②有機水銀は水俣病の原因。④二酸化硫黄は四日市ぜんそくの原因で、イタイイタイ病とは別。"}, {"id": "q6", "category": "公衆衛生学", "question": "近年の国民健康・栄養調査でみられる、総エネルギー摂取量に占める脂質の割合に近い数値はどれか。", "choices": ["10〜15%", "25〜30%", "40〜45%", "50〜55%"], "correctIndex": 1, "explanation": "近年の国民健康・栄養調査では、脂質のエネルギー比率はおおむね25〜30%程度で推移している。", "wrongExplanation": "①10〜15%は低すぎる数値。③④脂質エネルギー比率の目標量はおおむね20〜30%であり、40%を超える値は実態と合わない。"}, {"id": "q7", "category": "公衆衛生学", "question": "せきやくしゃみで飛び散った病原体を吸い込むことで感染する経路の名称はどれか。", "choices": ["接触感染", "垂直感染", "空気感染", "飛沫感染"], "correctIndex": 3, "explanation": "せき・くしゃみの飛沫を介する感染経路を飛沫感染と呼ぶ。", "wrongExplanation": "①接触感染は皮膚や物の表面を介した感染。②垂直感染は母子感染など。③空気感染は飛沫核が長時間空中を漂う感染で、せき・くしゃみの飛沫感染とは区別される。"}, {"id": "q8", "category": "公衆衛生学", "question": "40歳から74歳を対象とする特定健康診査・特定保健指導の実施根拠となっている法律はどれか。", "choices": ["地域保健法", "介護保険法", "健康増進法", "高齢者の医療の確保に関する法律"], "correctIndex": 3, "explanation": "特定健康診査・特定保健指導(メタボ健診)は高齢者医療確保法に基づき、40〜74歳を対象に実施される。", "wrongExplanation": "①地域保健法は保健所等の設置根拠。②介護保険法は介護保険制度の法律。③健康増進法は国民健康・栄養調査などを規定するが、特定健診の直接の根拠法ではない。"}, {"id": "q9", "category": "公衆衛生学", "question": "食育基本法に基づく「食育推進会議」が設置されている機関はどれか。", "choices": ["厚生労働省", "農林水産省", "内閣府(内閣総理大臣の下)", "文部科学省"], "correctIndex": 2, "explanation": "食育推進会議は内閣府、内閣総理大臣の下に設置されている。", "wrongExplanation": "①③④食育推進会議は厚生労働省・農林水産省・文部科学省のいずれでもなく、内閣府に設置されている。"}, {"id": "q10", "category": "公衆衛生学", "question": "調理師免許の取り消しや業務停止の検討対象となりうる事由として、正しいものはどれか。", "choices": ["調理業務に関して食中毒等の重大な事故を起こした場合のみが対象となる", "罰金以上の刑に処せられた場合は業務に無関係でも対象となりうる", "麻薬・あへん・大麻・覚醒剤の中毒者となった場合", "上記はいずれも取り消し・業務停止の検討対象となりうる"], "correctIndex": 3, "explanation": "調理師法では、麻薬等の中毒者、罰金刑以上の刑に処せられた者、食中毒など重大な事故を起こした者などが免許取消・業務停止の検討対象となりうる。", "wrongExplanation": "①②③はいずれも取消・停止の対象となりうる個別の事由であり、「のみ」「無関係なら対象外」等の限定表現が誤り。正しくはこれらすべてが検討対象となりうる。"}, {"id": "q11", "category": "公衆衛生学", "question": "市町村保健センターの設置根拠となっている法律はどれか。", "choices": ["医療法", "健康増進法", "調理師法", "地域保健法"], "correctIndex": 3, "explanation": "市町村保健センターは地域保健法に基づき市町村が設置する施設。", "wrongExplanation": "①医療法は病院等の施設基準を定める法律。②健康増進法は栄養調査などを規定。③調理師法は調理師資格に関する法律で、市町村保健センターとは無関係。"}, {"id": "q12", "category": "公衆衛生学", "question": "人口動態統計に関する指標のうち、人口1,000人あたりの数値として算出されないものはどれか。", "choices": ["出生率", "死亡率(粗死亡率)", "合計特殊出生率", "乳児死亡率"], "correctIndex": 2, "explanation": "人口動態統計の主な指標は人口1,000人当たりで算出されるが、合計特殊出生率は「15〜49歳の女性一人あたりの出生数」であり、1,000人当たりの指標ではない。", "wrongExplanation": "①②④出生率・死亡率(粗死亡率)・乳児死亡率はいずれも人口1,000人あたりで算出される。合計特殊出生率のみ「女性一人あたりの出生数」という別の算出方法。"}, {"id": "q13", "category": "公衆衛生学", "question": "次の感染症のうち、ウイルスが病原体となっているものはどれか。", "choices": ["腸チフス", "コレラ", "ペスト", "肝炎(A型・B型・C型)"], "correctIndex": 3, "explanation": "肝炎(A型・B型・C型)はウイルスが病原体。ペスト・コレラ・腸チフスは細菌が原因。", "wrongExplanation": "①腸チフスはサルモネラ属菌(細菌)が原因。②コレラはコレラ菌(細菌)が原因。③ペストはペスト菌(細菌)が原因。いずれもウイルスではない。"}, {"id": "q14", "category": "公衆衛生学", "question": "「第1次国民健康づくり対策」が始まった年として正しいものはどれか。", "choices": ["昭和53(1978)年", "昭和63(1988)年", "平成12(2000)年", "平成25(2013)年"], "correctIndex": 0, "explanation": "第1次国民健康づくり対策は昭和53(1978)年に開始された。", "wrongExplanation": "②昭和63年は第2次国民健康づくり対策(アクティブ80ヘルスプラン)の開始年。③平成12年は健康日本21の開始年。④平成25年は健康日本21(第二次)の開始年。"}, {"id": "q15", "category": "公衆衛生学", "question": "1950年から2023年にかけての日本人の栄養摂取の推移として、減少傾向にあるものはどれか。", "choices": ["カルシウム", "動物性たんぱく質", "脂質", "エネルギー(総摂取カロリー)"], "correctIndex": 3, "explanation": "1950年から2023年にかけて、日本人の1人当たりエネルギー摂取量は総じて減少傾向にある。", "wrongExplanation": "①カルシウムは長期的にみて摂取量が増加傾向。②動物性たんぱく質は増加傾向。③脂質摂取量も増加傾向にあり、減少しているのはエネルギー摂取量。"}, {"id": "q16", "category": "公衆衛生学", "question": "生活習慣病に分類される疾患として正しいものはどれか。", "choices": ["百日咳", "重症急性呼吸器症候群", "脳血管疾患", "腸管出血性大腸菌感染症"], "correctIndex": 2, "explanation": "生活習慣病には脳血管疾患、心疾患、糖尿病、がんなどが含まれる。", "wrongExplanation": "①百日咳、②重症急性呼吸器症候群(SARS)、④腸管出血性大腸菌感染症はいずれも感染症であり、生活習慣とは直接関係しない疾患。"}, {"id": "q17", "category": "公衆衛生学", "question": "四日市ぜんそくを引き起こした大気汚染物質はどれか。", "choices": ["水酸化ナトリウム", "有機水銀", "カドミウム", "二酸化硫黄"], "correctIndex": 3, "explanation": "四日市ぜんそくは、石油コンビナートから排出された二酸化硫黄による大気汚染が原因とされる。", "wrongExplanation": "①水酸化ナトリウムは強アルカリ性の物質で大気汚染とは無関係。②有機水銀は水俣病の原因。③カドミウムはイタイイタイ病の原因で、四日市ぜんそくとは別。"}, {"id": "q18", "category": "公衆衛生学", "question": "次のうち、健康増進法に規定されていない内容はどれか。", "choices": ["国民健康・栄養調査の実施", "食育推進基本計画の策定", "食事摂取基準の策定", "厚生労働大臣による基本方針の策定"], "correctIndex": 1, "explanation": "食育推進基本計画の策定は食育基本法に基づくものであり、健康増進法の規定内容ではない。", "wrongExplanation": "①③④国民健康・栄養調査の実施、食事摂取基準の策定、厚生労働大臣による基本方針の策定はいずれも健康増進法に規定されている。食育推進基本計画は食育基本法に基づくもの。"}, {"id": "q19", "category": "公衆衛生学", "question": "調理師法の目的に関する記述のうち、誤っているものはどれか。", "choices": ["調理技術の合理的な発達を図る", "国民の食生活の向上に寄与する", "調理業務従事者の資質を向上させる", "すべての調理師に専門調理師試験の受験を義務付ける"], "correctIndex": 3, "explanation": "調理師法は調理師の資質向上・調理技術の合理的発達・国民の食生活向上を目的としており、専門調理師試験の受験は任意で義務ではない。", "wrongExplanation": "①②③はいずれも調理師法が掲げる目的として正しい内容。専門調理師試験の受験を「すべての調理師に義務付ける」という制度は存在しない(任意の上位資格)。"}, {"id": "q20", "category": "公衆衛生学", "question": "公衆衛生行政の枠組みの中で、都道府県が設置する機関はどれか。", "choices": ["食育推進委員会", "地域医療支援病院", "市町村保健センター", "保健所"], "correctIndex": 3, "explanation": "保健所は都道府県・政令指定都市・中核市などが設置する。市町村保健センターは市町村が設置する点と区別しておきたい。", "wrongExplanation": "①食育推進委員会という名称の法定機関はない。②地域医療支援病院は医療法上の病院の類型で、行政機関ではない。③市町村保健センターは市町村が設置する。"}, {"id": "q21", "category": "食品学", "question": "とうもろこしの胚芽を原料として作られるものはどれか。", "choices": ["コーンスターチ", "ポップコーン", "コーン油", "デント種粉末"], "correctIndex": 2, "explanation": "とうもろこしの胚芽からはコーン油が製造される。", "wrongExplanation": "①コーンスターチは主に胚乳(でんぷん質)から作られる。②ポップコーンは種子全体(特に爆裂種)を加熱膨化させたもの。④デント種粉末は品種名であり製法の答えにはならない。"}, {"id": "q22", "category": "食品学", "question": "こんにゃくいもに多く含まれる粘性の多糖類はどれか。", "choices": ["ペクチン", "ムチン", "ガラクタン", "グルコマンナン"], "correctIndex": 3, "explanation": "こんにゃくいもに含まれる主要な粘質多糖はグルコマンナン。", "wrongExplanation": "①ペクチンは果物などに含まれる多糖類。②ムチンは動物性の粘性物質(山芋のねばりなどに使われる俗称で厳密には異なる)。③ガラクタンは寒天などに含まれる多糖類で、こんにゃくいもの主成分ではない。"}, {"id": "q23", "category": "食品学", "question": "日本なしを食べたときのざらざらとした独特の食感の原因はどれか。", "choices": ["タンニン", "アントシアニン", "ペクチン", "石細胞"], "correctIndex": 3, "explanation": "日本なしのざらざらした食感は、果肉に含まれる石細胞(硬い細胞)による。", "wrongExplanation": "①タンニンは渋味成分。②アントシアニンは赤紫色の色素成分。③ペクチンは細胞壁を構成する多糖類で、ざらつきの直接の原因ではない。"}, {"id": "q24", "category": "食品学", "question": "プロセスチーズの製造方法として正しいものはどれか。", "choices": ["生乳の水分をほぼ取り除いて作る", "牛乳をそのまま減圧濃縮して作る", "白かびで熟成させて作る", "ナチュラルチーズを加熱・溶解して加工する"], "correctIndex": 3, "explanation": "プロセスチーズは、ナチュラルチーズを加熱・溶融して乳化剤を加え、再成形したもの。", "wrongExplanation": "①水分をほぼ除去するのは粉乳などの製法。②減圧濃縮は練乳などの製法。③白かびで熟成させるのはカマンベールなどのナチュラルチーズの製法で、プロセスチーズは対象外。"}, {"id": "q25", "category": "食品学", "question": "香辛料とその辛味・色素の主成分の組み合わせとして正しいものはどれか。", "choices": ["ターメリック-カプサンチン", "しょうが-シニグリン", "こしょう-ピペリン", "とうがらし-クルクミン"], "correctIndex": 2, "explanation": "こしょうの辛味主成分はピペリン。とうがらしはカプサイシン、しょうがはジンゲロール、ターメリックはクルクミンが主成分。", "wrongExplanation": "①ターメリックの主成分はクルクミン(カプサンチンはパプリカなどの色素)。②しょうがの主成分はジンゲロール(シニグリンはからしなどの成分)。④とうがらしの主成分はカプサイシン(クルクミンはターメリックの成分)。組み合わせが入れ替わっている。"}, {"id": "q26", "category": "食品学", "question": "栄養機能食品としての栄養機能表示が認められていない成分はどれか。", "choices": ["ビタミンK", "n-3系脂肪酸", "カリウム", "ヨウ素"], "correctIndex": 2, "explanation": "栄養機能食品としての表示は各種ビタミン・ミネラルで認められているが、カリウムは腎機能への配慮から対象外とされている。", "wrongExplanation": "①③④ビタミンK、n-3系脂肪酸、ヨウ素はいずれも栄養機能食品の対象成分として表示が認められている。カリウムは腎臓病患者への配慮から対象外とされている。"}, {"id": "q27", "category": "食品学", "question": "日本食品標準成分表2020年版(八訂)で、エネルギー計算に用いられる炭水化物の項目はどれか。", "choices": ["総炭水化物", "粗灰分", "難消化性デキストリン", "利用可能炭水化物(単糖当量)"], "correctIndex": 3, "explanation": "日本食品標準成分表2020年版(八訂)では、エネルギー計算に「利用可能炭水化物(単糖当量)」が用いられる。", "wrongExplanation": "①総炭水化物は差引き法などで求める従来の項目。②粗灰分はミネラル量の指標でエネルギー計算には使わない。③難消化性デキストリンは食物繊維の一種で、エネルギー計算の基本項目ではない。"}, {"id": "q28", "category": "食品学", "question": "米に不足しがちで、第一制限アミノ酸とされるアミノ酸はどれか。", "choices": ["ロイシン", "メチオニン", "スレオニン(トレオニン)", "リシン(リジン)"], "correctIndex": 3, "explanation": "米はリシン(リジン)が不足しやすく、第一制限アミノ酸となる。", "wrongExplanation": "①ロイシン、②メチオニン、③スレオニンはいずれも必須アミノ酸だが、米で特に不足しやすい第一制限アミノ酸はリシン。"}, {"id": "q29", "category": "食品学", "question": "次の野菜のうち、緑黄色野菜に分類されるものはどれか。", "choices": ["たまねぎ", "なす", "キャベツ", "ほうれんそう"], "correctIndex": 3, "explanation": "緑黄色野菜はカロテン含量の高い野菜を指し、ほうれんそうが代表例。キャベツ・たまねぎ・なすは淡色野菜。", "wrongExplanation": "①たまねぎ、②なす、③キャベツはカロテン含量が少なく淡色野菜に分類される。緑黄色野菜の基準を満たすのはほうれんそう。"}, {"id": "q30", "category": "食品学", "question": "たまねぎを切ったときの刺激臭や涙の原因となる成分はどれか。", "choices": ["クルクミン", "ピペリン", "イソチオシアナート類", "アリシン(硫化アリルなど)"], "correctIndex": 3, "explanation": "たまねぎの刺激臭・催涙成分は、硫化アリル(アリシンなど)の含硫化合物による。", "wrongExplanation": "①クルクミンはターメリックの色素成分。②ピペリンはこしょうの辛味成分。③イソチオシアナート類はわさびやからしの辛味成分で、たまねぎの成分とは異なる。"}, {"id": "q31", "category": "食品学", "question": "乾しいたけに含まれる主なうま味成分はどれか。", "choices": ["イノシン酸", "グルタミン酸", "コハク酸", "グアニル酸"], "correctIndex": 3, "explanation": "乾しいたけのうま味成分は主にグアニル酸(核酸系うま味成分)。", "wrongExplanation": "①イノシン酸はかつお節のうま味成分。②グルタミン酸は昆布のうま味成分。③コハク酸は貝類のうま味成分で、乾しいたけの主成分はグアニル酸。"}, {"id": "q32", "category": "食品学", "question": "魚の可食部のうち、一般に脂質の含有量が多いのはどの部位か。", "choices": ["背部", "尾部", "頭部", "腹部"], "correctIndex": 3, "explanation": "魚類は一般に腹部(腹身)のほうが脂質含量が多い。", "wrongExplanation": "①②③背部・尾部・頭部よりも、内臓に近い腹部(腹身)のほうが一般に脂がのっている。"}, {"id": "q33", "category": "食品学", "question": "緑茶の渋味のもととなっている成分はどれか。", "choices": ["テアニン", "カフェイン", "アントシアニン", "カテキン"], "correctIndex": 3, "explanation": "緑茶の渋味成分はカテキン(タンニンの一種)。", "wrongExplanation": "①テアニンはうま味・甘味に関わる成分。②カフェインは苦味・覚醒作用の成分。③アントシアニンは色素成分で、緑茶の渋味の主体はカテキン。"}, {"id": "q34", "category": "食品学", "question": "酒税法で「酒類」と定義されるアルコール分の下限はどれか。", "choices": ["0.1%以上", "0.5%以上", "1%以上", "5%以上"], "correctIndex": 2, "explanation": "酒税法では、アルコール分1度以上の飲料を「酒類」と定義している。", "wrongExplanation": "①0.1%、②0.5%は酒税法上の酒類の基準に満たない。④5%は基準よりかなり高く、実際の下限は1%。"}, {"id": "q35", "category": "食品学", "question": "かんきつ類は、園芸学上どの分類に含まれるか。", "choices": ["核果類", "仁果類", "殻実類", "漿果類(液果類)"], "correctIndex": 3, "explanation": "かんきつ類は園芸学上「漿果類(液果類)」に分類される。", "wrongExplanation": "①核果類は桃やさくらんぼなど種を1つ持つ果実。②仁果類はりんごや梨など。③殻実類はくりなどの果実で、かんきつ類はいずれにも該当せず漿果類(液果類)に分類される。"}, {"id": "q36", "category": "食品学", "question": "ポップコーンの原料として使われる、とうもろこしの品種はどれか。", "choices": ["デント種", "フリント種", "スイートコーン種", "爆裂種"], "correctIndex": 3, "explanation": "ポップコーンの原料は爆裂種(ポップ種)のとうもろこし。", "wrongExplanation": "①デント種は主に飼料・コーンスターチ用。②フリント種は硬粒種で食用・飼料用。③スイートコーン種はとうもろこしとして食べる甘味種で、ポップコーン用は爆裂種。"}, {"id": "q37", "category": "食品学", "question": "スイカの果肉に赤い色をもたらしている成分はどれか。", "choices": ["アントシアニン", "カロテン", "フラボン", "リコピン"], "correctIndex": 3, "explanation": "スイカ果肉の赤色成分はリコピン。", "wrongExplanation": "①アントシアニンは赤紫〜青色の色素で、なすやぶどうなどに含まれる。②カロテンは黄橙色の色素。③フラボンは淡黄色の色素で、スイカの赤色の主体はリコピン。"}, {"id": "q38", "category": "食品学", "question": "スキムミルクパウダーの別名として正しいものはどれか。", "choices": ["全粉乳", "濃縮乳", "発酵乳", "脱脂粉乳"], "correctIndex": 3, "explanation": "スキムミルクパウダーは脱脂粉乳の別名。", "wrongExplanation": "①全粉乳は生乳をそのまま乾燥させた粉乳。②濃縮乳は生乳を濃縮した液状のもの。③発酵乳はヨーグルトなどを指し、脱脂粉乳とは製法・成分が異なる。"}, {"id": "q39", "category": "食品学", "question": "しょうがの辛味成分として正しいものはどれか。", "choices": ["カプサイシン", "シニグリン", "チャビシン", "ジンゲロール"], "correctIndex": 3, "explanation": "しょうがの辛味成分はジンゲロール(加熱するとショウガオールに変化する)。", "wrongExplanation": "①カプサイシンはとうがらしの辛味成分。②シニグリンはからしなどの辛味前駆物質。③チャビシンはこしょうの辛味成分の一種で、しょうがの主成分はジンゲロール。"}, {"id": "q40", "category": "食品学", "question": "アミノ酸スコアの算出において、基準に対して不足しているアミノ酸を何と呼ぶか。", "choices": ["必須アミノ酸", "非必須アミノ酸", "可欠アミノ酸", "制限アミノ酸"], "correctIndex": 3, "explanation": "アミノ酸スコアで基準に対して不足しているアミノ酸を制限アミノ酸と呼ぶ。", "wrongExplanation": "①必須アミノ酸は体内で合成できず食事から摂取が必要なアミノ酸全般を指す用語。②非必須アミノ酸は体内で合成できるアミノ酸。③可欠アミノ酸は非必須アミノ酸の別称。不足しているアミノ酸そのものを指す用語は制限アミノ酸。"}, {"id": "q41", "category": "栄養学", "question": "「食事バランスガイド」のコマのイラストで、軸として描かれているものはどれか。", "choices": ["主食", "牛乳・乳製品", "菓子・嗜好飲料", "水・お茶"], "correctIndex": 3, "explanation": "食事バランスガイドのコマの軸は「水・お茶」で描かれ、コマを回す力として運動が表現されている。", "wrongExplanation": "①主食、②牛乳・乳製品、③菓子・嗜好飲料はコマの各段(料理区分)として描かれているが、コマを貫く「軸」として描かれているのは水・お茶。"}, {"id": "q42", "category": "栄養学", "question": "糖質に関する記述として正しいものはどれか。", "choices": ["ヒト成人の体内に約5%存在する", "身体機能を調節する主な栄養素である", "ビタミンB6が欠乏すると利用性が低下する", "筋肉グリコーゲンは筋肉自身のエネルギー源として使われる"], "correctIndex": 3, "explanation": "筋肉グリコーゲンは分解され、筋肉自身のエネルギー源として利用される。", "wrongExplanation": "①糖質(グリコーゲンなど)は体内に約1%程度しか存在せず、5%は多すぎる。②身体機能の調節を主に担うのはビタミンやミネラルで、糖質は主にエネルギー源。③糖質の利用に関わるのはビタミンB1で、B6ではない。"}, {"id": "q43", "category": "栄養学", "question": "脂質のうち、細胞膜やステロイドホルモンの材料となるものはどれか。", "choices": ["中性脂肪", "脂肪酸", "グリセロール", "コレステロール"], "correctIndex": 3, "explanation": "コレステロールは細胞膜の構成成分や、ステロイドホルモン・胆汁酸の材料となる。", "wrongExplanation": "①中性脂肪はエネルギー貯蔵が主な役割。②脂肪酸は中性脂肪などの構成成分。③グリセロールも中性脂肪の構成成分で、細胞膜やホルモンの材料となるのはコレステロール。"}, {"id": "q44", "category": "栄養学", "question": "空腹感・満腹感など摂食行動を調節する中枢が存在する部位はどれか。", "choices": ["大脳新皮質", "小脳", "延髄", "間脳の視床下部"], "correctIndex": 3, "explanation": "摂食行動(空腹・満腹)は間脳の視床下部にある摂食中枢・満腹中枢によって調節される。", "wrongExplanation": "①大脳新皮質は思考や言語などを司る。②小脳は運動の調節を担う。③延髄は呼吸・循環など生命維持の中枢で、摂食行動を調節するのは視床下部。"}, {"id": "q45", "category": "栄養学", "question": "血糖値を上昇させる作用をもつホルモンはどれか。", "choices": ["インスリン", "サイロキシン", "コルチゾール", "グルカゴン"], "correctIndex": 3, "explanation": "グルカゴンは血糖値を上げるホルモン。インスリンは逆に血糖値を下げる。", "wrongExplanation": "①インスリンは逆に血糖値を下げるホルモン。②サイロキシンは代謝を促進する甲状腺ホルモンで血糖調節が主作用ではない。③コルチゾールも血糖上昇に関与するが、代表的に問われるのはグルカゴン。"}, {"id": "q46", "category": "栄養学", "question": "基礎代謝に関する記述として正しいものはどれか。", "choices": ["食後に測定する", "体表面積に反比例する", "睡眠中のエネルギー消費量のことである", "基礎代謝基準値は1〜2歳ごろに最大となる"], "correctIndex": 3, "explanation": "基礎代謝基準値(体重あたり)は1〜2歳頃が最も高く、加齢とともに低下していく。", "wrongExplanation": "①食後は消化のためエネルギー消費が増えるため、基礎代謝は安静・空腹時に測定する。②体表面積が大きいほど熱放散が多く、基礎代謝は体表面積に比例する。③睡眠中の消費量は基礎代謝よりやや低くなることが多く、同一の概念ではない。"}, {"id": "q47", "category": "栄養学", "question": "血液の凝固に関与するビタミンはどれか。", "choices": ["ビタミンA", "ビタミンD", "ビタミンE", "ビタミンK"], "correctIndex": 3, "explanation": "ビタミンKは血液凝固因子の生成に関わるビタミン。", "wrongExplanation": "①ビタミンAは視覚や皮膚粘膜の機能に関わる。②ビタミンDはカルシウム吸収に関わる。③ビタミンEは抗酸化作用をもつ。血液凝固に関わるのはビタミンK。"}, {"id": "q48", "category": "栄養学", "question": "高齢期に見られる身体的特徴として正しいものはどれか。", "choices": ["胃酸分泌の増加", "塩味の閾値の低下(感じやすくなる)", "基礎代謝量の増加", "咀しゃく力の低下"], "correctIndex": 3, "explanation": "高齢期には咀しゃく力の低下、塩味の閾値の上昇(感じにくくなる)、胃酸分泌の低下、基礎代謝量の低下などがみられる。", "wrongExplanation": "①高齢期は胃酸分泌が低下する傾向。②塩味を感じにくくなる(閾値が上昇する)傾向がある。③基礎代謝量は加齢とともに低下する。いずれも実際とは逆の内容。"}, {"id": "q49", "category": "栄養学", "question": "痛風の栄養管理において、避けるべきとされることはどれか。", "choices": ["水分の摂取", "プリン体の制限", "適度な運動", "アルコールの多飲"], "correctIndex": 3, "explanation": "痛風(高尿酸血症)では、プリン体・尿酸の産生を促すアルコール(特にビール)の多飲は避けるべきとされる。", "wrongExplanation": "①水分摂取はむしろ尿酸排泄を促すため推奨される。②プリン体の制限は避けるべきことではなく推奨される対策。③適度な運動も推奨される。避けるべきなのはプリン体・尿酸産生を促すアルコールの多飲。"}, {"id": "q50", "category": "栄養学", "question": "「6つの基礎食品」の分類で、炭水化物を主に含む食品が属する群はどれか。", "choices": ["第1群", "第2群", "第4群", "第6群"], "correctIndex": 3, "explanation": "6つの基礎食品群のうち、穀類・いも類など炭水化物を主とする食品は第6群に分類される。", "wrongExplanation": "①第1群はたんぱく質性食品(魚・肉・卵・大豆)。②第2群は乳・乳製品・骨ごと食べる魚など。③第4群は緑黄色野菜など。炭水化物を主とする穀類・いも類は第6群。"}, {"id": "q51", "category": "栄養学", "question": "多糖類であるセルロースの特徴として正しいものはどれか。", "choices": ["ヒトの消化酵素で分解される", "ぶどう糖が枝分かれして結合している", "主に肝臓に存在する", "ヒトの消化酵素では分解されない(食物繊維となる)"], "correctIndex": 3, "explanation": "セルロースはヒトの消化酵素では分解されず、食物繊維として機能する。", "wrongExplanation": "①セルロースはヒトの消化酵素では分解されない。②枝分かれ構造をもつのはグリコーゲンなど。③セルロースは主に植物の細胞壁に存在し、肝臓に存在するものではない。"}, {"id": "q52", "category": "栄養学", "question": "必須脂肪酸(リノール酸など)についての記述として正しいものはどれか。", "choices": ["体内で合成できる", "常温で固体である", "飽和脂肪酸に分類される", "食物から摂取する必要がある"], "correctIndex": 3, "explanation": "必須脂肪酸(リノール酸など)は体内で合成できないため、食物から摂取する必要がある。", "wrongExplanation": "①必須脂肪酸は体内で合成できないため「必須」とされる。②③必須脂肪酸(リノール酸など)は常温で液体の不飽和脂肪酸であり、飽和脂肪酸には分類されない。"}, {"id": "q53", "category": "栄養学", "question": "たんぱく質を構成する元素のうち、糖質や脂質には含まれないものはどれか。", "choices": ["炭素", "水素", "酸素", "窒素"], "correctIndex": 3, "explanation": "たんぱく質は炭素・水素・酸素に加えて窒素を含む点が、糖質・脂質と異なる特徴。", "wrongExplanation": "①②③炭素・水素・酸素は糖質・脂質にも共通して含まれる元素。たんぱく質だけに含まれる特徴的な元素は窒素。"}, {"id": "q54", "category": "栄養学", "question": "β-カロテンが体内で変換されて作られるビタミンはどれか。", "choices": ["ビタミンB1", "ビタミンC", "ビタミンD", "ビタミンA"], "correctIndex": 3, "explanation": "β-カロテンは体内でビタミンAに変換される(プロビタミンA)。", "wrongExplanation": "①ビタミンB1、②ビタミンC、③ビタミンDはいずれもβ-カロテンから直接変換されるものではない。β-カロテンはプロビタミンAとしてビタミンAに変換される。"}, {"id": "q55", "category": "栄養学", "question": "カルシウムの腸管吸収を促進するビタミンはどれか。", "choices": ["ビタミンB2", "ビタミンE", "葉酸", "ビタミンD"], "correctIndex": 3, "explanation": "ビタミンDはカルシウムの腸管での吸収を促進する。", "wrongExplanation": "①ビタミンB2はエネルギー代謝に関わる。②ビタミンEは抗酸化作用。③葉酸は細胞分裂やDNA合成に関わる。カルシウムの腸管吸収を促進する代表的なビタミンはビタミンD。"}, {"id": "q56", "category": "栄養学", "question": "鉄欠乏性貧血が特に多くみられるライフステージはどれか。", "choices": ["乳児期", "成人男性", "高齢期", "学童期・思春期"], "correctIndex": 3, "explanation": "鉄欠乏性貧血は、成長による需要増や偏食が重なりやすい学童期・思春期に多くみられる。", "wrongExplanation": "①乳児期、②成人男性、③高齢期に比べ、成長による鉄需要の増加と食生活の乱れが重なりやすい学童期・思春期(特に月経のある女子)で鉄欠乏性貧血が多くみられる。"}, {"id": "q57", "category": "栄養学", "question": "膵臓のランゲルハンス島から分泌され、血糖値を下げる作用をもつホルモンはどれか。", "choices": ["インスリン", "アドレナリン", "コルチゾール", "グルカゴン"], "correctIndex": 0, "explanation": "インスリンは膵臓(ランゲルハンス島のβ細胞)から分泌され、血糖値を下げる唯一のホルモン。", "wrongExplanation": "②アドレナリンと③コルチゾールはいずれも血糖値を上げる方向に働くホルモンで、血糖値を下げる作用はない。④グルカゴンも血糖値を上げるホルモンであり、血糖値を下げるのはインスリンのみ。"}, {"id": "q58", "category": "栄養学", "question": "胎児の神経管閉鎖障害の予防のために、妊娠前後に摂取が推奨される栄養素はどれか。", "choices": ["鉄", "亜鉛", "銅", "葉酸"], "correctIndex": 3, "explanation": "葉酸不足は胎児の神経管閉鎖障害のリスクを高めるため、妊娠前後の摂取が推奨される。", "wrongExplanation": "①鉄は貧血予防に関わる。②亜鉛は味覚や免疫に関わる。③銅も酵素の構成成分だが、神経管閉鎖障害の予防に特に重要とされるのは葉酸。"}, {"id": "q59", "category": "栄養学", "question": "脱水を起こしやすい高齢者への対策として適切なものはどれか。", "choices": ["水分摂取の制限", "塩分のみの摂取", "カフェインの多飲", "こまめな水分補給"], "correctIndex": 3, "explanation": "高齢者は口渇感が鈍くなりやすいため、のどの渇きを感じる前からのこまめな水分補給が推奨される。", "wrongExplanation": "①水分摂取を制限すると脱水が悪化する。②塩分のみでは水分補給にならない。③カフェインには利尿作用があり、脱水を助長しうる。適切なのはこまめな水分補給。"}, {"id": "q60", "category": "栄養学", "question": "エネルギー産生栄養素バランス(PFCバランス)を構成する要素に含まれないものはどれか。", "choices": ["たんぱく質", "脂質", "炭水化物", "ビタミン"], "correctIndex": 3, "explanation": "PFCバランスは「たんぱく質(P)・脂質(F)・炭水化物(C)」の構成比であり、ビタミンは含まれない。", "wrongExplanation": "①たんぱく質、②脂質、③炭水化物はPFCバランスを構成する3要素そのもの。ビタミンはエネルギー産生栄養素ではないため含まれない。"}, {"id": "q61", "category": "食品衛生学", "question": "微生物が増殖するために必要な3つの条件の組み合わせとして正しいものはどれか。", "choices": ["栄養素・湿度・光", "酸素・温度・振動", "水分・光・気圧", "栄養素・水分・温度"], "correctIndex": 3, "explanation": "微生物の増殖には栄養素・水分・温度の3条件がそろうことが必要とされる。", "wrongExplanation": "①③湿度・光・気圧は微生物の増殖条件として一般的に挙げられるものではない。②酸素・振動も直接の必須条件ではなく、正しくは栄養素・水分・温度の3条件。"}, {"id": "q62", "category": "食品衛生学", "question": "アフラトキシンを産生する微生物として正しいものはどれか。", "choices": ["細菌", "ウイルス", "リケッチア", "かび"], "correctIndex": 3, "explanation": "アフラトキシンはかび(アスペルギルス属)が産生するカビ毒。", "wrongExplanation": "①②③細菌・ウイルス・リケッチアはアフラトキシンを作らない。アフラトキシンはアスペルギルス属などのかびが産生するカビ毒。"}, {"id": "q63", "category": "食品衛生学", "question": "ボツリヌス菌に関する記述のうち、正しいものはどれか。", "choices": ["好気性菌である", "芽胞を形成しない", "低温で活発に増殖する", "酸素のない状態で増殖する(嫌気性)"], "correctIndex": 3, "explanation": "ボツリヌス菌は芽胞を形成し、酸素のない状態(嫌気性条件)で増殖・毒素を産生する。", "wrongExplanation": "①ボツリヌス菌は酸素のない環境を好む嫌気性菌。②芽胞を形成し、熱や乾燥に強い。③低温では増殖が抑制される。いずれも実際の性質と逆。"}, {"id": "q64", "category": "食品衛生学", "question": "細菌性食中毒予防の3原則に含まれないものはどれか。", "choices": ["菌をつけない", "菌を増やさない", "菌を殺菌する", "菌を冷凍する"], "correctIndex": 3, "explanation": "食中毒予防の3原則は「菌をつけない・増やさない・やっつける(殺菌する)」であり、冷凍は原則には含まれない(増殖は抑えられるが殺菌はできない)。", "wrongExplanation": "①②③菌をつけない・増やさない・殺菌するは食中毒予防の3原則そのもの。冷凍は増殖を抑えるだけで殺菌効果がないため、3原則には含まれない。"}, {"id": "q65", "category": "食品衛生学", "question": "海水魚(特にヒラメ)を主な感染源とする寄生虫はどれか。", "choices": ["肝吸虫", "トキソプラズマ", "クリプトスポリジウム", "クドア・セプテンプンクタータ"], "correctIndex": 3, "explanation": "海水魚(特にヒラメ)を介して感染するクドア・セプテンプンクタータは寄生虫性食中毒の原因となる。", "wrongExplanation": "①肝吸虫は淡水魚(コイ科など)を感染源とする。②トキソプラズマは主に生肉や猫との接触が感染源。③クリプトスポリジウムは水を介して感染する原虫。海水魚由来の代表的な寄生虫はクドア・セプテンプンクタータ。"}, {"id": "q66", "category": "食品衛生学", "question": "一日摂取許容量(ADI)の定義として正しいものはどれか。", "choices": ["一日に一度だけ摂取してよい最大量", "無毒性量と同じ数値", "毒性が現れ始める最小量", "一生涯にわたって毎日摂取し続けても健康に影響がないと判断される量"], "correctIndex": 3, "explanation": "ADI(一日摂取許容量)は、人が一生涯毎日摂取し続けても健康への悪影響がないと推定される一日あたりの摂取量。", "wrongExplanation": "①「一日に一度だけ」という限定はADIの定義にない。②無毒性量(NOAEL)はADI算出の基礎データであり、ADIそのものではない(安全係数で割って算出する)。③毒性の閾値ではなく、安全に摂取し続けられる量を示す指標。"}, {"id": "q67", "category": "食品衛生学", "question": "大量調理施設における二次汚染防止策として、誤っているものはどれか。", "choices": ["食品は床面から60cm以上の場所で扱う", "器具は流水洗浄後に75℃・1分間以上加熱する", "下処理は汚染作業区域で行う", "調理終了後の食品はふたをせず冷却する"], "correctIndex": 3, "explanation": "二次汚染防止の観点から、調理終了後の食品はふたをするなどして温度上昇や汚染を防ぐ必要があり、「ふたをせず冷却する」のは不適切。", "wrongExplanation": "①②③はいずれも適切な二次汚染防止策。調理後の食品は速やかにふたをするなどして温度上昇や汚染を防ぐ必要があり、「ふたをせず冷却する」が誤り。"}, {"id": "q68", "category": "食品衛生学", "question": "HACCP(ハサップ)システムの目的として正しいものはどれか。", "choices": ["最終製品の抜き取り検査の徹底", "一般衛生管理プログラムの廃止", "記録保管の簡略化", "製造工程全体を通じた安全管理"], "correctIndex": 3, "explanation": "HACCPは原材料の受け入れから出荷までの全工程で危害要因を分析し、重要管理点を継続的に監視する衛生管理手法。", "wrongExplanation": "①抜き取り検査だけでは工程全体の安全は保証できない。②一般衛生管理プログラムはHACCPの土台であり廃止するものではない。③記録の保管・活用はHACCPの重要な要素であり、簡略化が目的ではない。"}, {"id": "q69", "category": "食品衛生学", "question": "表示義務のある特定原材料に指定されているアレルギー物質はどれか。", "choices": ["アーモンド", "ごま", "さば", "かに"], "correctIndex": 3, "explanation": "表示義務のある特定原材料8品目は、卵・乳・小麦・えび・かに・そば・落花生・くるみ。", "wrongExplanation": "①アーモンドは表示が推奨される品目(準ずるもの)ではあるが義務ではない。②ごまも同様に義務品目ではない。③さばは義務ではなく推奨表示品目。表示義務がある8品目の一つはかに。"}, {"id": "q70", "category": "食品衛生学", "question": "ノロウイルスに対するアルコール消毒の効果について正しい記述はどれか。", "choices": ["非常に高い殺菌効果がある", "100%アルコールであれば効果がある", "加熱より消毒効果が高い", "一般に消毒効果は低い(次亜塩素酸ナトリウム等が推奨される)"], "correctIndex": 3, "explanation": "ノロウイルスはアルコール消毒の効果が低く、次亜塩素酸ナトリウムによる消毒や十分な加熱が有効とされる。", "wrongExplanation": "①②アルコールはノロウイルスに対して十分な効果を発揮しにくく、100%濃度でも同様。③加熱(85〜90℃・90秒以上)のほうが確実で、アルコール消毒がそれを上回ることはない。"}, {"id": "q71", "category": "食品衛生学", "question": "食品衛生法上、「食品」に含まれないものはどれか。", "choices": ["飲料", "添加物", "器具・容器包装", "医薬部外品"], "correctIndex": 3, "explanation": "食品衛生法では、医薬品・医薬部外品を除くすべての飲食物を「食品」と定義している。", "wrongExplanation": "①飲料、②添加物、③器具・容器包装はいずれも食品衛生法上「食品」またはその関連物として扱われる。医薬品・医薬部外品は食品衛生法上「食品」から除外されている。"}, {"id": "q72", "category": "食品衛生学", "question": "消費期限の表示対象となる食品の特徴として正しいものはどれか。", "choices": ["長期間保存が可能な食品", "冷凍食品", "砂糖や塩などの調味料", "品質が急速に劣化しやすい食品"], "correctIndex": 3, "explanation": "消費期限は、弁当・惣菜・生菓子など品質が急速に劣化しやすい食品に表示される。", "wrongExplanation": "①長期保存が可能な食品には賞味期限が使われる。②冷凍食品も比較的日持ちするため賞味期限の対象になることが多い。③調味料も同様に賞味期限が一般的。消費期限は弁当・惣菜など急速に劣化する食品に用いられる。"}, {"id": "q73", "category": "食品衛生学", "question": "サルモネラ属菌の主な感染源として正しいものはどれか。", "choices": ["魚介類", "穀類", "水道水", "食肉(鶏肉など)、卵"], "correctIndex": 3, "explanation": "サルモネラ属菌は、鶏肉などの食肉や卵を主な感染源とする。", "wrongExplanation": "①魚介類、②穀類、③水道水は主要な感染源としては一般的でない。サルモネラ属菌は鶏肉などの食肉や卵を主な感染源とする。"}, {"id": "q74", "category": "食品衛生学", "question": "カンピロバクター食中毒の主な症状として正しいものはどれか。", "choices": ["激しい嘔吐のみ", "筋肉の麻痺", "皮膚の発疹", "下痢、腹痛、発熱"], "correctIndex": 3, "explanation": "カンピロバクター食中毒は、下痢・腹痛・発熱を主症状とする(潜伏期間が比較的長いのも特徴)。", "wrongExplanation": "①嘔吐のみでなく下痢・腹痛・発熱を伴うのが典型的。②筋肉の麻痺はボツリヌス菌などの症状。③皮膚の発疹は主症状ではない。"}, {"id": "q75", "category": "食品衛生学", "question": "残留農薬や動物用医薬品などを対象に、基準のないものの流通を原則禁止する制度の対象品目はどれか。", "choices": ["既存添加物", "遺伝子組換え食品", "特定原材料", "残留農薬、飼料添加物、動物用医薬品"], "correctIndex": 3, "explanation": "ポジティブリスト制度は、残留農薬・飼料添加物・動物用医薬品を対象に、基準のないものの流通を原則禁止する制度。", "wrongExplanation": "①既存添加物は個別に安全性評価・指定されるもので、ポジティブリスト制度とは別の枠組み。②遺伝子組換え食品は表示制度の対象。③特定原材料はアレルギー表示制度の対象で、ポジティブリスト制度の対象ではない。"}, {"id": "q76", "category": "食品衛生学", "question": "大量調理施設における調理従事者の検便頻度として適切なものはどれか。", "choices": ["1年に1回", "半年に1回", "週に1回", "月に1回以上"], "correctIndex": 3, "explanation": "大量調理施設では、調理従事者の検便を月1回以上行うことが求められる。", "wrongExplanation": "①1年に1回、②半年に1回、③週に1回はいずれも大量調理施設衛生管理マニュアルが求める頻度と一致しない。適切な頻度は月1回以上。"}, {"id": "q77", "category": "食品衛生学", "question": "化膿創のある調理従事者がとるべき対応として正しいものはどれか。", "choices": ["消毒してそのまま調理する", "汚染作業区域でのみ作業する", "手袋を二重にして調理する", "直接食品に触れる作業を控える"], "correctIndex": 3, "explanation": "化膿創のある調理従事者は、直接食品に触れる作業を控える必要がある。", "wrongExplanation": "①消毒しても化膿創からの汚染リスクは残るため、そのまま調理するのは不適切。②汚染作業区域に限定しても食品への接触を完全には避けられない。③手袋を二重にしても直接食品に触れる作業自体を避けるべき。"}, {"id": "q78", "category": "食品衛生学", "question": "L-アスコルビン酸の食品添加物としての主な用途はどれか。", "choices": ["保存料", "甘味料", "着色料", "酸化防止剤"], "correctIndex": 3, "explanation": "L-アスコルビン酸(ビタミンC)は、酸化防止剤として食品添加物に利用される。", "wrongExplanation": "①保存料、②甘味料、③着色料はいずれも異なる目的の添加物区分。L-アスコルビン酸(ビタミンC)の主な用途は酸化防止剤。"}, {"id": "q79", "category": "食品衛生学", "question": "豚肉、特にレバーの生食が主な感染経路となるウイルス性肝炎はどれか。", "choices": ["牛肉", "鶏肉", "馬肉", "豚肉(特にレバーの生食)"], "correctIndex": 3, "explanation": "E型肝炎ウイルスは、豚肉、特に豚レバーなどの生食が主な感染源となる。", "wrongExplanation": "①牛肉、②鶏肉、③馬肉は主な感染源ではない。E型肝炎ウイルスは豚肉、特にレバーの生食が主な感染経路とされる。"}, {"id": "q80", "category": "食品衛生学", "question": "調理器具やふきんの消毒に用いられる殺菌料の適切な使用法はどれか。", "choices": ["食品の味付けに用いる", "高温で加熱して用いる", "アルコールと混ぜて用いる", "ふきんや器具の消毒に用いる"], "correctIndex": 3, "explanation": "次亜塩素酸ナトリウムは、主にふきんや調理器具の消毒に用いられる殺菌料。", "wrongExplanation": "①味付けに使う調味料ではなく殺菌料である。②高温加熱すると分解し効果が落ちる。③アルコールと混ぜると有害なガスが発生する危険があり、正しい使い方はふきんや器具の消毒。"}, {"id": "q81", "category": "調理理論", "question": "「味の抑制効果」の例として正しいものはどれか。", "choices": ["しるこに塩を入れると甘味が強まる", "昆布と鰹節を合わせるとうま味が強まる", "コーヒーに砂糖を入れると苦味が消える", "酢の物に砂糖を入れると酸味が和らぐ"], "correctIndex": 3, "explanation": "酢の物に砂糖を加えると酸味が和らいで感じられる。これは「味の抑制効果」の代表例。", "wrongExplanation": "①しるこに塩を入れると甘味が「強まる」のは対比効果の例で、抑制効果とは逆の現象。②昆布とかつお節の組み合わせはうま味の相乗効果の例。③コーヒーに砂糖で苦味が消えるように感じるのは抑制効果の一種だが、代表例として問われるのは酢の物に砂糖を加えて酸味を和らげる例。"}, {"id": "q82", "category": "調理理論", "question": "たけのこを下ゆでしてアクを抜く際に加える材料として適切なものはどれか。", "choices": ["酢", "重曹", "塩", "米ぬか"], "correctIndex": 3, "explanation": "たけのこのアク抜きには、米ぬか(と唐辛子)を加えて茹でる方法が一般的。", "wrongExplanation": "①酢はあく抜きには一般的に使われない。②重曹は山菜のあく抜きなどに使われるが、たけのこでは風味を損ねやすく一般的でない。③塩だけではあく(えぐみ)成分を十分に抜けない。米ぬかを加えて茹でるのが一般的。"}, {"id": "q83", "category": "調理理論", "question": "スチームコンベクションオーブンの特徴として正しいものはどれか。", "choices": ["スチームの最高温度は50℃である", "自然対流式である", "揚げ物専用機である", "蒸す・焼く・煮るが1台で可能"], "correctIndex": 3, "explanation": "スチームコンベクションオーブンは、蒸す・焼く・煮るなど複数の加熱方式を1台でこなせる機器。", "wrongExplanation": "①スチームの温度は100℃前後まで上げられ、50℃は低すぎる。②強制対流式(ファンで熱風循環)が主流で、自然対流式ではない。③蒸す・焼く・煮るなど多用途に使える機器で、揚げ物専用ではない。"}, {"id": "q84", "category": "調理理論", "question": "イタリア料理のコース構成で「プリモピアット」に含まれない料理はどれか。", "choices": ["パスタ", "リゾット", "ミネストローネ", "アクアパッツァ"], "correctIndex": 3, "explanation": "イタリア料理のプリモピアットにはパスタ・リゾット・スープ(ミネストローネなど)が該当し、アクアパッツァ(魚料理)はセコンドピアットにあたる。", "wrongExplanation": "①パスタ、②リゾット、③ミネストローネはいずれもプリモピアット(第一の皿)に含まれる料理。アクアパッツァは魚料理でセコンドピアット(メイン)に分類される。"}, {"id": "q85", "category": "調理理論", "question": "うるち米を炊飯する際の適切な加水量(重量比)はどれか。", "choices": ["0.7倍", "2.0倍", "3.0倍", "1.2〜1.5倍"], "correctIndex": 3, "explanation": "うるち米の炊飯時の加水量は、米の重量に対しおおむね1.2〜1.5倍程度が目安とされる。", "wrongExplanation": "①0.7倍では水分が不足し芯が残る。②2.0倍、③3.0倍はかなり多く、粥のようになってしまう。うるち米の適切な加水量はおおむね1.2〜1.5倍。"}, {"id": "q86", "category": "調理理論", "question": "小麦粉のドウに食塩を加えた場合の影響として正しいものはどれか。", "choices": ["粘弾性が減少する", "伸展性がなくなる", "発酵が止まる", "粘弾性が増加する"], "correctIndex": 3, "explanation": "小麦粉のドウに食塩を加えるとグルテンが引き締まり、粘弾性が増す。", "wrongExplanation": "①②③食塩を加えるとグルテンの網目構造が引き締まり、粘弾性は減少ではなく増加する。伸展性がなくなったり発酵が完全に止まったりするわけではない。"}, {"id": "q87", "category": "調理理論", "question": "なすのぬか漬けで紫色を安定させるために加えられるものはどれか。", "choices": ["砂糖", "醤油", "重曹", "ミョウバン(または古釘)"], "correctIndex": 3, "explanation": "なすのぬか漬けでは、ミョウバンや古釘(鉄分)を加えることでアントシアニン色素が安定し、紫色が保たれる。", "wrongExplanation": "①砂糖には色素を安定させる作用はない。②醤油は調味目的で色の安定とは直接関係しない。③重曹はアルカリ性で、アントシアニンの色调を変化させてしまう。色を安定させるにはミョウバンや古釘(鉄分)を用いる。"}, {"id": "q88", "category": "調理理論", "question": "雑味を出さずに昆布からだしを取るための適切な方法はどれか。", "choices": ["沸騰した湯で長時間煮る", "白い粉(マンニット)を水で完全に洗い流す", "10%の塩を加える", "水に入れて沸騰直前に取り出す"], "correctIndex": 3, "explanation": "昆布だしは沸騰させると雑味や粘りが出るため、水から入れて沸騰直前に取り出すのが適切。", "wrongExplanation": "①沸騰させて長時間煮ると雑味やぬめりが出てしまう。②白い粉(マンニット)はうま味成分の一部であり、洗い流すべきものではない。③大量の塩を加えるのは適切な方法ではない。水から入れ、沸騰直前に取り出すのが基本。"}, {"id": "q89", "category": "調理理論", "question": "新鮮な魚の身をそぎ切りにし、冷水で洗って身を締める調理法はどれか。", "choices": ["酢に漬ける", "沸騰した湯を通す", "塩を振って放置する", "そぎ切りにして冷水(または流水)で洗う"], "correctIndex": 3, "explanation": "魚の「あらい」は身をそぎ切りにし、冷水(または流水)で洗い締める調理法。", "wrongExplanation": "①酢に漬けるのは「しめ」の技法。②沸騰した湯を通すのは霜降りなど別の技法。③塩を振って放置するのも「しめ」の一種で、「あらい」とは異なる。あらいはそぎ切りにして冷水で洗い、身を締める調理法。"}, {"id": "q90", "category": "調理理論", "question": "鶏卵の鮮度が低下した際に見られる変化として正しいものはどれか。", "choices": ["比重が大きくなる", "卵白のpHが低下する", "卵黄膜が強くなる", "水様卵白が増加する"], "correctIndex": 3, "explanation": "卵は鮮度が落ちると、水様卵白(サラサラした卵白)の割合が増える。", "wrongExplanation": "①②③新鮮な卵は比重が大きく、卵白のpHは低め、卵黄膜も強いが、鮮度が落ちるとこれらは逆の変化(比重低下、pH上昇、卵黄膜が弱くなる)を示す。鮮度低下でみられるのは水様卵白の増加。"}, {"id": "q91", "category": "食文化概論", "question": "ベトナムのフォーに使われる魚醤(発酵調味料)はどれか。", "choices": ["ナンプラー", "ショッツル", "カピ", "ヌクマム"], "correctIndex": 3, "explanation": "ベトナムのフォーには魚醤であるヌクマムが使われる(タイのナンプラーと同系統の調味料)。", "wrongExplanation": "①ナンプラーはタイの魚醤。②ショッツルは秋田のはたはた魚醤(日本の調味料)。③カピはタイなどで使われるえびペースト。ベトナムのフォーに使われる魚醤はヌクマム。"}, {"id": "q92", "category": "食文化概論", "question": "日本の食品ロス量は、世界の食料援助量のおよそ何倍に相当するとされているか。", "choices": ["0.5倍", "3倍", "10倍", "1.2倍"], "correctIndex": 3, "explanation": "日本の食品ロス量は、世界の食料援助量の約1.2倍に相当するとされる。", "wrongExplanation": "①0.5倍では援助量を下回ることになり、実態と逆。②③3倍・10倍は過大な数値。実際の推計値に近いのは約1.2倍。"}, {"id": "q93", "category": "食文化概論", "question": "会席料理の配膳順で、最初に出されるものはどれか。", "choices": ["焼き物", "吸い物", "ご飯", "前菜"], "correctIndex": 3, "explanation": "会席料理では、最初に前菜(先付)が出され、その後に吸い物・刺身・焼き物などが続く。", "wrongExplanation": "①焼き物、②吸い物、③ご飯はいずれも前菜より後に出される料理。会席料理は前菜(先付)から始まるのが基本。"}, {"id": "q94", "category": "食文化概論", "question": "スペイン料理「ガスパチョ」の特徴として正しいものはどれか。", "choices": ["温かいトマトスープ", "魚介の炊き込みご飯", "羊肉の串焼き", "冷たい「飲むサラダ」と呼ばれる野菜スープ"], "correctIndex": 3, "explanation": "ガスパチョはスペイン発祥の、生野菜をすりつぶした冷製スープで「飲むサラダ」とも呼ばれる。", "wrongExplanation": "①ガスパチョは冷製スープで温かくはない。②魚介の炊き込みご飯はパエリアなど別のスペイン料理。③羊肉の串焼きも別料理。ガスパチョは生野菜をすりつぶした冷たい「飲むサラダ」。"}, {"id": "q95", "category": "食文化概論", "question": "精進料理で避けられる「五葷(ごくん)」に含まれる野菜はどれか。", "choices": ["ほうれんそう", "大根", "ごぼう", "にんにく"], "correctIndex": 3, "explanation": "精進料理で禁じられる五葷には、にんにく・ねぎ・にら・らっきょうなど臭いの強い野菜が含まれる。", "wrongExplanation": "①ほうれんそう、②大根、③ごぼうは香りの強い野菜ではなく、五葷には含まれない。五葷は臭いの強いねぎ類(にんにく・ねぎ・にらなど)を指す。"}, {"id": "q96", "category": "食文化概論", "question": "日本のカロリーベース食料自給率の近年の傾向として正しいものはどれか。", "choices": ["上昇し続けている", "80%を超えている", "毎年10%ずつ低下している", "概ね38%前後で推移している"], "correctIndex": 3, "explanation": "日本のカロリーベース食料自給率は、近年おおむね38%前後で推移している。", "wrongExplanation": "①近年の自給率はほぼ横ばい〜微減で「上昇し続けている」わけではない。②80%を大きく下回る水準。③「毎年10%ずつ」の急激な低下は起きていない。実際にはおおむね38%前後で推移。"}, {"id": "q97", "category": "食文化概論", "question": "地域で生産された農産物や食品を、その地域内で消費する取り組みを表す言葉として正しいものはどれか。", "choices": ["外国資本の店を排除すること", "自給自足を義務付けること", "輸出を禁止すること", "地域で生産されたものをその地域で消費すること"], "correctIndex": 3, "explanation": "地産地消とは、地域で生産された農産物・食品をその地域で消費する取り組みを指す。", "wrongExplanation": "①外国資本排除、②自給自足の義務化、③輸出禁止はいずれも地産地消の定義とは異なる。地産地消は地域で生産されたものをその地域で消費する取り組みを指す。"}, {"id": "q98", "category": "食文化概論", "question": "ハレの日の行事食である「赤飯」に用いられる豆はどれか。", "choices": ["大豆", "枝豆", "コーヒー豆", "小豆(またはささげ)"], "correctIndex": 3, "explanation": "赤飯には小豆(またはささげ)が用いられ、赤色が魔除け・祝いの意味を持つとされる。", "wrongExplanation": "①大豆、②枝豆、③コーヒー豆は赤飯には使われない。赤飯に使われる豆は小豆(またはささげ)。"}, {"id": "q99", "category": "食文化概論", "question": "世界の飢餓人口への食料援助量と比較した、日本の食品ロス量の現状として正しいものはどれか。", "choices": ["援助量より少ない", "援助量とほぼ同等である", "統計が存在しない", "援助量を大きく上回っている"], "correctIndex": 3, "explanation": "日本の食品ロス量は、世界の食料援助量を大きく上回っているとされる。", "wrongExplanation": "①援助量より少ないというのは実態と逆。②「ほぼ同等」も過小評価。③統計は実際に存在する。日本の食品ロス量は援助量を大きく上回っているとされる。"}, {"id": "q100", "category": "食文化概論", "question": "米飯を杉の棒に巻き付けて焼く郷土料理「きりたんぽ」の主な産地はどれか。", "choices": ["北海道", "沖縄県", "石川県", "秋田県"], "correctIndex": 3, "explanation": "きりたんぽは、つぶした米飯を杉の棒に巻き付けて焼いた秋田県の郷土料理で、鶏がらだしの「きりたんぽ鍋」が特に有名。", "wrongExplanation": "①北海道、②沖縄県、③石川県はきりたんぽの産地ではない。きりたんぽは秋田県の郷土料理。"}];

/* ===== ストレージ ===== */
const STORAGE_KEY = 'chourishi_progress_v1';
let progress = { wrongIds: [], attempts: {}, paused: null, notes: {} };
// attempts[id] = {tries, correct}
// paused = {ids: [...], index, correctCount, wrongThisSession: [...], label} | null

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      progress = JSON.parse(res.value);
      if(!progress.wrongIds) progress.wrongIds = [];
      if(!progress.attempts) progress.attempts = {};
      if(progress.paused === undefined) progress.paused = null;
      if(!progress.notes) progress.notes = {};
    }
  }catch(e){ /* no saved data yet */ }
}
async function saveProgress(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false); }
  catch(e){ console.error('save failed', e); }
}

/* ===== カテゴリ定義 ===== */
const CATEGORY_ORDER = ['公衆衛生学','食品学','栄養学','食品衛生学','調理理論','食文化概論'];
function questionsByCategory(cat){ return QUIZ_DATA.filter(q => q.category === cat); }

/* ===== 状態 ===== */
let session = { queue: [], index: 0, correctCount: 0, wrongThisSession: [], label: '' };

/* ===== 画面切替 ===== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===== ホーム描画 ===== */
function renderHome(){
  const total = QUIZ_DATA.length;
  const answeredIds = Object.keys(progress.attempts);
  const answered = answeredIds.length;
  let correctTotal = 0, triesTotal = 0;
  answeredIds.forEach(id => { correctTotal += progress.attempts[id].correct; triesTotal += progress.attempts[id].tries; });
  const acc = triesTotal ? Math.round(correctTotal / triesTotal * 100) : null;

  document.getElementById('stat-answered').textContent = answered + '/' + total;
  document.getElementById('stat-accuracy').textContent = acc === null ? '–' : acc + '%';
  document.getElementById('stat-weak').textContent = progress.wrongIds.length;

  const list = document.getElementById('menu-list');
  list.innerHTML = '';

  if(progress.paused){
    const p = progress.paused;
    const li = document.createElement('li');
    li.innerHTML = `
      <button class="menu-item special" data-mode="resume">
        <span><span class="name">続きから<span class="badge">中断中</span></span><span class="sub">${p.label} ・ ${p.index + 1}問目で中断</span></span>
        <span class="count">${p.ids.length}問</span>
      </button>`;
    list.appendChild(li);
  }

  if(progress.wrongIds.length > 0){
    const li = document.createElement('li');
    li.innerHTML = `
      <button class="menu-item special" data-mode="review">
        <span><span class="name">復習<span class="badge">要復習</span></span><span class="sub">これまで間違えた問題だけ</span></span>
        <span class="count">${progress.wrongIds.length}問</span>
      </button>`;
    list.appendChild(li);
  }

  const noteCount = Object.keys(progress.notes || {}).filter(id => (progress.notes[id] || '').trim()).length;
  if(noteCount > 0){
    const li = document.createElement('li');
    li.innerHTML = `
      <button class="menu-item special" data-mode="notes">
        <span><span class="name">メモ一覧<span class="badge">${noteCount}件</span></span><span class="sub">書き留めたメモを見返す</span></span>
        <span class="count">→</span>
      </button>`;
    list.appendChild(li);
  }

  const allLi = document.createElement('li');
  allLi.innerHTML = `
    <button class="menu-item" data-mode="all">
      <span><span class="name">全問シャッフル</span><span class="sub">問題数を選んで出題</span></span>
      <span class="count">${total}問</span>
    </button>`;
  list.appendChild(allLi);

  CATEGORY_ORDER.forEach(cat => {
    const qs = questionsByCategory(cat);
    const li = document.createElement('li');
    li.innerHTML = `
      <button class="menu-item" data-mode="cat" data-cat="${cat}">
        <span><span class="name">${cat}</span></span>
        <span class="count">${qs.length}問</span>
      </button>`;
    list.appendChild(li);
  });

  list.querySelectorAll('.menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      if(mode === 'resume') resumeSession();
      else if(mode === 'review') startSession(shuffle(QUIZ_DATA.filter(q => progress.wrongIds.includes(q.id))), '復習');
      else if(mode === 'notes') openNotes();
      else if(mode === 'all') openCountModal();
      else startSession(shuffle(questionsByCategory(btn.dataset.cat)), btn.dataset.cat);
    });
  });
}

/* ===== 問題数選択モーダル ===== */
function openCountModal(){
  const total = QUIZ_DATA.length;
  const options = [10, 20, 30, 50, total].filter((n, i, arr) => arr.indexOf(n) === i && n <= total);
  const wrap = document.getElementById('count-options');
  wrap.innerHTML = '';
  options.forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'count-opt';
    btn.innerHTML = `<span class="n">${n}</span>問`;
    btn.addEventListener('click', () => {
      closeCountModal();
      const picked = shuffle(QUIZ_DATA.slice()).slice(0, n);
      startSession(picked, `全問シャッフル(${n}問)`);
    });
    wrap.appendChild(btn);
  });
  document.getElementById('count-modal').classList.add('show');
}
function closeCountModal(){
  document.getElementById('count-modal').classList.remove('show');
}
document.getElementById('count-cancel').addEventListener('click', closeCountModal);
document.getElementById('count-modal').addEventListener('click', (e) => {
  if(e.target.id === 'count-modal') closeCountModal();
});

document.getElementById('open-stats').addEventListener('click', () => {
  renderStats();
  showScreen('screen-stats');
});
document.getElementById('stats-back').addEventListener('click', () => {
  showScreen('screen-home');
});

function openNotes(){
  renderNotes();
  showScreen('screen-notes');
}
document.getElementById('notes-back').addEventListener('click', () => {
  showScreen('screen-home');
});

function renderNotes(){
  const panel = document.getElementById('notes-panel');
  const idToQ = {};
  QUIZ_DATA.forEach(q => { idToQ[q.id] = q; });

  const entries = Object.keys(progress.notes || {})
    .map(id => ({ id, text: progress.notes[id], q: idToQ[id] }))
    .filter(e => e.q && (e.text || '').trim());

  if(entries.length === 0){
    panel.innerHTML = `<div class="stats-empty">まだメモはありません。<br>問題を解いて解答した後、メモ欄に書き込むとここに一覧表示されます。</div>`;
    return;
  }

  let html = `<div class="weak-list">`;
  entries.forEach(e => {
    html += `
      <div class="weak-item">
        <div class="weak-item-top"><span class="weak-cat">${e.q.category}</span></div>
        <div class="weak-q">${e.q.question}</div>
        <div class="weak-a">正解：${e.q.choices[e.q.correctIndex]}</div>
        <textarea class="note-edit" data-id="${e.id}" placeholder="メモを書く...">${e.text}</textarea>
      </div>`;
  });
  html += `</div>`;
  panel.innerHTML = html;

  panel.querySelectorAll('.note-edit').forEach(ta => {
    ta.addEventListener('input', (ev) => {
      const id = ev.target.dataset.id;
      const text = ev.target.value;
      if(text.trim()) progress.notes[id] = text;
      else delete progress.notes[id];
      clearTimeout(memoSaveTimer);
      memoSaveTimer = setTimeout(() => { memoSaveTimer = null; saveProgress(); }, 500);
    });
  });
}

function renderStats(){
  const panel = document.getElementById('stats-panel');
  const answeredIds = Object.keys(progress.attempts);

  function barColor(pct){
    if(pct >= 80) return 'var(--green)';
    if(pct >= 50) return 'var(--gold)';
    return 'var(--red)';
  }

  const resetHtml = `
    <div class="reset-row">
      <button class="reset-link" id="stats-reset-btn">すべての記録をリセットして最初からやり直す</button>
    </div>`;

  if(answeredIds.length === 0){
    panel.innerHTML = `<div class="stats-empty">まだ解答した問題がありません。<br>問題を解くとここに正答率が表示されます。</div>` + resetHtml;
    bindResetButton();
    return;
  }

  let correctTotal = 0, triesTotal = 0;
  answeredIds.forEach(id => { correctTotal += progress.attempts[id].correct; triesTotal += progress.attempts[id].tries; });
  const overallAcc = triesTotal ? Math.round(correctTotal / triesTotal * 100) : 0;

  let html = `
    <h3>全体</h3>
    <div class="stats-row">
      <div class="stats-row-head"><span class="cat-name">総合正答率</span><span class="cat-nums">${answeredIds.length}/${QUIZ_DATA.length}問 解答済み</span></div>
      <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${overallAcc}%; background:${barColor(overallAcc)}"></div></div>
    </div>
    <h3>分野別正答率</h3>
  `;

  CATEGORY_ORDER.forEach(cat => {
    const qs = questionsByCategory(cat);
    let c = 0, t = 0, answeredInCat = 0;
    qs.forEach(q => {
      const a = progress.attempts[q.id];
      if(a){ c += a.correct; t += a.tries; answeredInCat++; }
    });
    const pct = t ? Math.round(c / t * 100) : null;
    html += `
      <div class="stats-row">
        <div class="stats-row-head"><span class="cat-name">${cat}</span><span class="cat-nums">${pct === null ? '未着手' : pct + '%'} ・ ${answeredInCat}/${qs.length}問</span></div>
        <div class="stats-bar-track"><div class="stats-bar-fill" style="width:${pct || 0}%; background:${barColor(pct || 0)}"></div></div>
      </div>`;
  });

  const idToQ = {};
  QUIZ_DATA.forEach(q => idToQ[q.id] = q);
  const weakQs = progress.wrongIds.map(id => idToQ[id]).filter(Boolean);

  html += `<h3>苦手な問題（${weakQs.length}問）</h3>`;
  if(weakQs.length === 0){
    html += `<div class="stats-empty" style="padding:14px 4px;">今のところ苦手な問題はありません。</div>`;
  } else {
    html += `<div class="weak-list">`;
    weakQs.forEach(q => {
      const a = progress.attempts[q.id] || { tries: 0, correct: 0 };
      html += `
        <div class="weak-item">
          <div class="weak-item-top">
            <span class="weak-cat">${q.category}</span>
            <span class="weak-tries">${a.tries}回中 ${a.correct}回正解</span>
          </div>
          <div class="weak-q">${q.question}</div>
          <div class="weak-a">正解：${q.choices[q.correctIndex]}</div>
        </div>`;
    });
    html += `</div>`;
  }

  html += resetHtml;
  panel.innerHTML = html;
  bindResetButton();
}

function bindResetButton(){
  const btn = document.getElementById('stats-reset-btn');
  if(!btn) return;
  btn.addEventListener('click', () => {
    if(confirm('これまでの解答記録・苦手リスト・メモはすべて消えます。本当にリセットしますか？')){
      progress = { wrongIds: [], attempts: {}, paused: null, notes: {} };
      saveProgress();
      renderStats();
      renderHome();
    }
  });
}

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* 選択肢の並びもシャッフルした「出題用」コピーを作る（正誤判定は元データのidで行う） */
function shuffleChoices(q){
  const order = shuffle([0, 1, 2, 3]);
  const choices = order.map(i => q.choices[i]);
  const correctIndex = order.indexOf(q.correctIndex);
  return { id: q.id, category: q.category, question: q.question, choices, correctIndex, explanation: q.explanation };
}

/* ===== セッション開始 ===== */
function startSession(queue, label){
  if(queue.length === 0) return;
  const displayQueue = queue.map(shuffleChoices);
  session = { queue: displayQueue, index: 0, correctCount: 0, wrongThisSession: [], label };
  progress.paused = null;
  saveProgress();
  showScreen('screen-quiz');
  renderQuestion();
}

function resumeSession(){
  const p = progress.paused;
  if(!p) return;
  const idToQ = {};
  QUIZ_DATA.forEach(q => idToQ[q.id] = q);
  const queue = p.ids.map(id => idToQ[id]).filter(Boolean).map(shuffleChoices);
  session = {
    queue,
    index: Math.min(p.index, queue.length - 1),
    correctCount: p.correctCount,
    wrongThisSession: p.wrongThisSession.slice(),
    label: p.label
  };
  showScreen('screen-quiz');
  renderQuestion();
}

/* ===== 問題描画 ===== */
let currentAnswered = false;

function renderQuestion(){
  const q = session.queue[session.index];
  currentAnswered = false;
  document.getElementById('quiz-cat-label').textContent = session.label;
  document.getElementById('quiz-count-label').textContent = (session.index + 1) + ' / ' + session.queue.length;
  document.getElementById('progress-fill').style.width = ((session.index) / session.queue.length * 100) + '%';
  document.getElementById('qcard-cat').textContent = q.category;
  document.getElementById('qcard-text').textContent = q.question;
  document.getElementById('explain-text').textContent = q.explanation || '';
  document.getElementById('wrong-text').textContent = q.wrongExplanation || '';

  const stamp = document.getElementById('stamp');
  stamp.className = 'stamp';
  stamp.textContent = '';

  const choicesEl = document.getElementById('qcard-choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="num">${i + 1}</span><span>${choice}</span>`;
    btn.addEventListener('click', () => onAnswer(i, q));
    choicesEl.appendChild(btn);
  });

  const explainBox = document.getElementById('explain-box');
  explainBox.classList.remove('show');
  document.getElementById('explain-text').textContent = q.explanation || '';

  const memoBox = document.getElementById('memo-box');
  memoBox.classList.remove('show');
  const memoInput = document.getElementById('memo-input');
  memoInput.value = (progress.notes && progress.notes[q.id]) || '';
  document.getElementById('memo-saved').classList.remove('show');

  document.getElementById('next-bar').style.display = 'none';
}

function onAnswer(selectedIndex, q){
  const buttons = document.querySelectorAll('#qcard-choices .choice-btn');
  const isCorrect = selectedIndex === q.correctIndex;

  buttons.forEach((b, i) => {
    b.disabled = true;
    if(i === q.correctIndex) b.classList.add('correct');
    else if(i === selectedIndex) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const stamp = document.getElementById('stamp');
  stamp.textContent = isCorrect ? '正' : '誤';
  stamp.classList.add(isCorrect ? 'ok' : 'ng');
  requestAnimationFrame(() => stamp.classList.add('show'));

  if(!progress.attempts[q.id]) progress.attempts[q.id] = { tries: 0, correct: 0 };
  progress.attempts[q.id].tries += 1;
  if(isCorrect){
    progress.attempts[q.id].correct += 1;
    progress.wrongIds = progress.wrongIds.filter(id => id !== q.id);
    session.correctCount += 1;
  } else {
    if(!progress.wrongIds.includes(q.id)) progress.wrongIds.push(q.id);
    if(!session.wrongThisSession.includes(q.id)) session.wrongThisSession.push(q.id);
  }
  saveProgress();

  document.getElementById('explain-box').classList.add('show');
  const wrongLabel = document.getElementById('wrong-label');
  wrongLabel.style.display = q.wrongExplanation ? 'block' : 'none';
  document.getElementById('memo-box').classList.add('show');
  document.getElementById('next-bar').style.display = 'block';
  document.getElementById('btn-next').textContent =
    (session.index + 1 < session.queue.length) ? '次の問題へ' : '結果を見る';

  currentAnswered = true;
}

document.getElementById('btn-next').addEventListener('click', () => {
  flushMemoSave();
  session.index += 1;
  if(session.index < session.queue.length){
    renderQuestion();
  } else {
    document.getElementById('progress-fill').style.width = '100%';
    showResult();
  }
});

let memoSaveTimer = null;
function flushMemoSave(){
  if(memoSaveTimer){
    clearTimeout(memoSaveTimer);
    memoSaveTimer = null;
    saveProgress();
  }
}
document.getElementById('memo-input').addEventListener('input', (e) => {
  const q = session.queue[session.index];
  if(!q) return;
  const text = e.target.value;
  if(!progress.notes) progress.notes = {};
  if(text.trim()){
    progress.notes[q.id] = text;
  } else {
    delete progress.notes[q.id];
  }
  clearTimeout(memoSaveTimer);
  memoSaveTimer = setTimeout(() => {
    memoSaveTimer = null;
    saveProgress();
    const saved = document.getElementById('memo-saved');
    saved.classList.add('show');
    setTimeout(() => saved.classList.remove('show'), 1200);
  }, 500);
});


document.getElementById('quiz-back').addEventListener('click', () => {
  flushMemoSave();
  // 回答済みの問題があれば次の問題から再開できるよう、インデックスを進めて保存する
  const resumeIndex = currentAnswered ? session.index + 1 : session.index;

  if(resumeIndex >= session.queue.length){
    // 最後の問題まで答え終えていた場合はそのまま結果画面へ
    showResult();
    return;
  }

  progress.paused = {
    ids: session.queue.map(q => q.id),
    index: resumeIndex,
    correctCount: session.correctCount,
    wrongThisSession: session.wrongThisSession.slice(),
    label: session.label
  };
  saveProgress();
  renderHome();
  showScreen('screen-home');
});

/* ===== 結果画面 ===== */
function showResult(){
  progress.paused = null;
  saveProgress();
  const total = session.queue.length;
  const correct = session.correctCount;
  const pct = Math.round(correct / total * 100);
  document.getElementById('result-eyebrow').textContent = session.label + ' ・ お疲れさまでした';
  document.getElementById('result-score').innerHTML = correct + '<span>/' + total + '</span>';
  document.getElementById('result-sub').textContent = '正答率 ' + pct + '%';

  const retryBtn = document.getElementById('result-retry-wrong');
  if(session.wrongThisSession.length > 0){
    retryBtn.style.display = 'block';
    retryBtn.textContent = `この回で間違えた${session.wrongThisSession.length}問だけ復習`;
    retryBtn.onclick = () => {
      const qs = QUIZ_DATA.filter(q => session.wrongThisSession.includes(q.id));
      startSession(shuffle(qs), '直前の復習');
    };
  } else {
    retryBtn.style.display = 'none';
  }

  showScreen('screen-result');
}

document.getElementById('result-home').addEventListener('click', () => {
  renderHome();
  showScreen('screen-home');
});

/* ===== 初期化 ===== */
(async function init(){
  await loadProgress();
  renderHome();
})();
</script>
